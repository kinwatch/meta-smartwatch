#@TYPE: Machine
#@NAME: Google Pixel Watch 2 LTE (eos, 6.6/WearOS-6+ re-port)
#@DESCRIPTION: Pixel Watch 2 LTE on the GKI 6.6 base (BP3A.250905.014.W3).
# MILESTONE 2a target: headless boot to WiFi + ssh. The LXC Android container,
# libhybris/gbinder HALs, UI (lipstick) and LTE are DEFERRED -- none are needed
# for WiFi/ssh, and they are the frontier risk. Bring them up later, with ssh
# observability in hand. See docs/watch-port-target-plan.md "Milestone 2".

require conf/machine/include/arm/armv7a/tune-cortexa7.inc
DEFAULTTUNE = "armv7vehf-neon"
require conf/machine/include/hybris-watch.inc

# No Android container yet: drop the android-init/android-system that
# hybris-watch.inc adds, and do NOT ship the LXC bundle (deferred). A headless
# Linux userspace (systemd + connman + ssh) is the 2a target.
IMAGE_INSTALL:remove = "android-init android-system"

MACHINE_HAS_WLAN = "true"
MACHINE_HAS_SPEAKER = "true"
MACHINE_DISPLAY_ROUND = "true"

# --- Kernel: our from-source GKI 6.6 Image (stock config, SYSVIPC=n), packaged
# as a prebuilt by linux-eos (NOT built in-tree; no 6.6 device-kernel source).
# Prebuilt aarch64 blob -> linux-eos sets PACKAGE_ARCH=MACHINE_ARCH itself; no
# aarch64 TUNE_PKGARCH needed (nothing compiles). ---
PREFERRED_PROVIDER_virtual/kernel = "linux-eos"
PREFERRED_VERSION_linux-eos = "6.6.82+git%"

PREFERRED_PROVIDER_android-tools-conf = "android-tools-conf-configfs"

# --- WiFi: qcacld WLAN + regulatory db + WLAN firmware shipped to /lib/firmware
# (eos-wlan-firmware) so we don't need the dm-linear /vendor mount for 2a. ---
IMAGE_INSTALL += "wireless-regdb-static"
IMAGE_INSTALL += "eos-wlan-firmware"

# connman firewall backend = nftables (needs only 5 nft kernel modules, all
# built into GKI/RPROVIDED by linux-eos) instead of iptables (which pulls its
# whole xt_* extension set as kernel-module deps).
PACKAGECONFIG:pn-connman = "wispr nftables client wifi wpa-supplicant systemd"

# --- Prebuilt 6.6 vendor modules (extracted from 04's factory vendor_dlkm):
# qcacld (WLAN) + the SoC chain, shipped to the rootfs so post-boot loads work. ---
IMAGE_INSTALL += "eos-vendor-modules eos-modules-autoload"

# --- Remote dev access + observability (replaces adb-over-USB, which the dwc3
# first-stage gadget can't provide on 6.6). ssh over WiFi is the dev channel. ---
IMAGE_INSTALL += "openssh"

# --- DEFERRED to later milestones (frontier risk; not needed for WiFi/ssh) ---
# LXC Android container:  lxc eos-lxc-android
# HAL shims:              eos-libui-compat-layer sensorfw-hybris-binder-plugins bluebinder eos-disable-whs
# LTE:                    ofono libgbinder-radio ... ofono-binder-plugin lte-data
