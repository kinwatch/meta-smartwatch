[Settings]
# aurora / Pixel Watch 2 exposes the core radio HAL as AIDL
# (android.hardware.radio.*.IRadio*), not HIDL. Point the plugin at AIDL.
InterfaceType=aidl
# AIDL radio services register on the regular binder node, not /dev/hwbinder.
Device=/dev/binder
# Single-SIM (eSIM) watch. The slot NAME must match the AIDL service instance:
# qcrilNrd registers android.hardware.radio.*.IRadio*/slot1, so the slot is
# named "slot1" (the plugin looks for IRadioModem/<slotname>). path is the ofono
# D-Bus modem path.
ExpectSlots=slot1

[slot1]
path=/ril_0
slot=0
