[Unit]
# usb-moded.service has DefaultDependencies=no and is only ordered after
# local-fs.target/dbus.socket, so systemd is free to start it concurrently
# with init_gfs.service (also After=local-fs.target only). usb_moded's own
# configfs_init() bails if /config/usb_gadget/g1 doesn't exist yet -- if that
# race is lost, usb_moded falls back into its retry loop, which is where the
# init-done flag file (touched by this unit's own ExecStartPre, moments
# before ExecStart) gets latched true on the first retry and permanently
# disables appsync (and therefore adb) for the rest of the boot. Ordering
# after init_gfs.service removes the race at its source instead of working
# around its symptom.
Wants=init_gfs.service
After=init_gfs.service
