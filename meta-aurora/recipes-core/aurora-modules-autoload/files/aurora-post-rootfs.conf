# Modules whose .ko files live on the rootfs (/lib/modules/<KREL>/vendor/)
# and therefore cannot be loaded from the VKB initramfs modules.load.aurora.
# Systemd's systemd-modules-load.service walks this file at boot, after the
# rootfs is mounted -- modprobe then resolves dependencies from modules.dep.
# Order is informational; modprobe handles dep resolution.

# --- WLAN (qcacld-3.0 + CNSS platform glue) ---
# wlan.ko is the qcacld driver. icnss2 is the integrated cnss subsystem that
# brokers WLFW QMI between the driver and the modem firmware. The cnss_*
# helpers are utility modules.
wlan
icnss2
cnss_nl
cnss_plat_ipc_qmi_svc
cnss_prealloc
cnss_utils
wlan_firmware_service
google_wlan_mac

# --- ASoC machine driver + codecs ---
# machine_dlkm is monaco-asoc-snd. Pulls bolero/wcd/wsa/macros/swr via deps.
# We list a few key ones explicitly so a stale modules.dep does not bite.
machine_dlkm
stub_dlkm
bolero_cdc_dlkm
besbev_dlkm
besbev-slave_dlkm
wsa883x_dlkm
wcd9xxx_dlkm
wcd_core_dlkm
rx_macro_dlkm
tx_macro_dlkm
va_macro_dlkm
swr_dlkm
swr_ctrl_dlkm
pinctrl_lpi_dlkm
pmw5100-spmi_dlkm
cc_dlkm
audio_cc_ipc_dlkm

# --- BT slimbus codec + power (gated by qcom,wcn-btfm in DT) ---
# bt_fm_slim registers "btfmslim_slave" -- required by monaco-asoc-snd's WCN BT
# dai_links.
bt_fm_slim
btpower

# --- BT vHCI (host-side virtual HCI for bluebinder) ---
hci_vhci

# --- Cellular data path (LTE) --- REQUIRED whenever the modem runs (LTE-ON) ---
# IPA + rmnet modules for the modem data plane. They produce the rmnet_ipa0
# netdev (rmnet_data0 mux channels appear at data-attach).
#
# CRITICAL (found 2026-06-23, on-device bisection): these are NOT optional/data-
# only. Without them there is no rmnet_ipa0 / IPA endpoint, so ~28s after every
# LTE attach the modem's packet-switched/data-services task starves waiting on the
# AP data path and its firmware watchdog kills it:
#   qcom_q6v5_pas 6080000.remoteproc-mss: fatal error: dog_hb.c:367 Task
#   starvation: ps, ping  ->  modem SSR  ->  re-acquire  ->  crash again (forever).
# The watch then looks like "registers on LTE then drops every ~30s / 1% signal".
# With rmnet_ipa0 present the modem stays registered (validated: 150s+ clean vs
# 28s crash). Load before the modem attaches. (Only meaningful with LTE enabled;
# inert if the modem is held off by lte-disable.)
#
# rmnet_core deps pull rmnet_ctl (+ qrtr/qmi_helpers/ipa_fmwk); listed explicitly
# so a stale modules.dep does not bite. ipa_clientsm pulls rndisipam.
rmnet_ctl
rmnet_core
ipanetm
ipa_clientsm

# --- Power management: system deep-sleep (RPM VDD_MIN) ---
# REQUIRED for standby battery life. Without these the SoC NEVER power-collapses
# to VDD_MIN during suspend: the CPU halts and each subsystem (apss/modem/adsp)
# reaches its own sleep, but the system-level vote that drops the CX/MX rails to
# minimum never fires, so the rails stay up at a ~37-40 mA floor (~8 h, ~10x the
# WearOS idle). Found 2026-06-25 on-device: these .ko files ship but were not
# being auto-loaded, so qcom_sleep_stats/vmin Count stayed 0 for the device's
# whole uptime. Loading them makes the apps processor signal its sleep state to
# RPM (smp2p_sleepstate) and puts the PMIC into LPM (qti_pmic_lpm); vmin then
# starts entering (Client_votes 0x0 -> non-zero) and standby draw collapses.
#  - smp2p_sleepstate : apps->RPM "asleep" signal over SMP2P (the missing vote)
#  - qti_pmic_lpm     : PMIC low-power-mode during sleep
#  - soc_sleep_stats / subsystem_sleep_stats / rpm_master_stat : expose
#    /sys/kernel/debug/qcom_sleep_stats (vmin/vlow/apss/modem/adsp counts +
#    Accumulated Duration) -- the metric used to verify deep-sleep is working.
smp2p_sleepstate
qti_pmic_lpm
soc_sleep_stats
subsystem_sleep_stats
rpm_master_stat

# qcom_lpm = the QCOM low-power-mode cpuidle GOVERNOR. Loading it is necessary but
# NOT sufficient: it must also be made the ACTIVE cpuidle governor (the stock
# menu/teo governors never select the deep cluster level that votes VDD_MIN).
# On-device proof 2026-06-25: governor=menu -> vmin Count FLAT (0 new), floor
# ~27-52 mA; governor=qcom-cpu-lpm -> vmin +2025 in ~20 min, floor collapses to
# single-digit mA. The active-governor switch is done by the companion oneshot
# unit aurora-cpuidle-lpm.service (runs after this modules-load).
qcom_lpm
